name: Organizar arquivos da biblioteca

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preparar-site.yml'
      - 'Trabalho_Design_Web_Luiza_Kelly*.zip'

permissions:
  contents: write

jobs:
  organizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extrair os arquivos do projeto
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          arquivos = sorted(Path('.').glob('Trabalho_Design_Web_Luiza_Kelly*.zip'))
          if len(arquivos) != 1:
              raise SystemExit('Envie apenas um ZIP do trabalho na pasta principal do repositorio.')
          with ZipFile(arquivos[0]) as pacote:
              itens = [item for item in pacote.infolist() if not item.is_dir()]
              if len(itens) != 18:
                  raise SystemExit('O ZIP correto deve conter os 18 arquivos do site.')
              for item in itens:
                  caminho = PurePosixPath(item.filename)
                  if caminho.is_absolute() or '..' in caminho.parts or '\\' in item.filename:
                      raise SystemExit('O ZIP contem um caminho invalido.')
                  if len(caminho.parts) < 2 or caminho.parts[0] != 'biblioteca-unifecaf':
                      raise SystemExit('Os arquivos devem estar dentro de biblioteca-unifecaf no ZIP.')
                  destino = Path(*caminho.parts[1:])
                  destino.parent.mkdir(parents=True, exist_ok=True)
                  destino.write_bytes(pacote.read(item))
          print('Os 18 arquivos foram extraidos com suas pastas.')
          PY
      - name: Salvar os arquivos no repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html apresentacao.html README.md css assets
          if git diff --cached --quiet; then
            echo 'Os arquivos ja estao organizados.'
            exit 0
          fi
          git commit -m 'Organizar os 18 arquivos do site de Luiza Kelly dos Santos'
          git push
